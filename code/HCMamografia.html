<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONCOPATH - Registro de Pacientes</title>
    <link rel="stylesheet" href="css/Dash.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

    <div class="dashboard-container">

                <h1>Oncopath</h1>
            </div>

            <div class="topbar-right">
                <div class="user-info">
                    <i class="fas fa-user-circle user-avatar"></i>
                    <span class="user-name">Dra. Ana López</span>
                </div>
                <button class="logout-btn" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i>
                    Cerrar Sesión
                </button>
            </div>
        </header>

        <div class="main-content">

            <!-- ===== BARRA LATERAL CON SUBMENÚ ===== -->
            <aside class="sidebar">
                <nav>
                    <ul>
                        <li>

                                <i class="fas fa-chart-pie"></i> Inicio
                            </a>
                        </li>

                        <li>
                            <a href="pacientes.html">
                                <i class="fas fa-users"></i> Pacientes
                            </a>
                        </li>

                        <!-- ===== NUEVOS PACIENTES CON SUBMENÚ ===== -->
                        <li class="has-submenu">
                            <a href="RPacientes.html" class="active" class="menu-toggle" onclick="toggleSubmenu(event)">
                                <i class="fas fa-user-plus"></i> Llenado de Historial
                                <i class="fas fa-chevron-down arrow"></i>
                            </a>
                            <ul class="submenu">
                                <li>
                                    <a href="RPacientes.html#datos-personales">
                                        <i class="fas fa-id-card"></i> HISTORIA CLÍNICA HEMATO
                                    </a>
                                </li>
                                <li>
                                    <a href="RPacientes.html#datos-medicos">
                                        <i class="fas fa-notes-medical"></i> HISTORIA CLÍNICA CIRUGIA
                                    </a>
                                </li>
                                <li>
                                    <a href="RPacientes.html#plan-tratamiento" class="active1">
                                        <i class="fas fa-clipboard-list"></i> HISTORIA CLÍNICA MAMOGRAFIA
                                    </a>
                                </li>
                            </ul>
                        </li>

                        <li>
                            <a href="diagnostico.html">
                                <i class="fas fa-stethoscope"></i> Diagnóstico
                            </a>
                        </li>

                        <li>
                            <a href="consulta.html">
                                <i class="fas fa-comments"></i> Consulta
                            </a>
                        </li>

                        <li>
                            <a href="cirugia.html">
                                <i class="fas fa-syringe"></i> Cirugía
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <i class="fas fa-file-medical"></i> Historiales
                            </a>
                        </li>
                    </ul>
                </nav>
            </aside>

            <!-- ===== CONTENIDO ===== -->
            <main>

            </main>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        /* ===== CERRAR SESIÓN ===== */
        function cerrarSesion() {
            if (confirm("¿Estás seguro de que deseas cerrar sesión?")) {
                window.location.href = "login.html";
            }
        }

        /* ===== SUBMENÚ DESPLEGABLE ===== */
        function toggleSubmenu(e) {
            e.preventDefault();
            const li = e.currentTarget.parentElement;
            li.classList.toggle("open");
        }
    </script>

</body>
</html>
